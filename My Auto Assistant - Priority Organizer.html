<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Auto Assistant - Priority Organizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif;background:#f1f5f9}
  @media(min-width:1024px){ .sticky-form{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto} .tasks-scroll{max-height:calc(100vh - 32px);overflow-y:auto;padding-left:4px} }
  #toast{transition:all .3s}
  @media print{ .no-print{display:none!important} body{background:white!important} .tasks-scroll{max-height:none!important;overflow:visible!important} .sticky-form{display:none!important} #printArea{box-shadow:none!important;border:none!important} .task-card{break-inside:avoid;border:1px solid #ddd!important} }
</style>
</head>
<body class="text-slate-800">
<div id="toast" class="no-print fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none">✅ Saved, here it is</div>
<header class="no-print bg-gradient-to-r from-teal-900 via-emerald-800 to-teal-900 text-white py-5 text-center shadow-md">
  <h1 class="text-2xl md:text-3xl font-extrabold">📖 My Auto Assistant - Priority Organizer</h1>
  <p class="text-sm text-emerald-100 mt-1">Clear your mind, organize your worries, and relax - No Ads</p>
</header>
<div class="no-print max-w-6xl mx-auto px-4 mt-4">
  <div class="bg-white rounded-2xl shadow border p-3 flex flex-wrap gap-2 items-center justify-between">
    <div class="flex gap-2">
      <button onclick="filterTasks('all')" class="filter-btn bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-full">All <span id="cAll"></span></button>
      <button onclick="filterTasks('pending')" class="filter-btn bg-white border text-sm font-bold px-4 py-2 rounded-full">⏳ Pending <span id="cPend"></span></button>
      <button onclick="filterTasks('done')" class="filter-btn bg-white border text-sm font-bold px-4 py-2 rounded-full">✅ Done <span id="cDone"></span></button>
    </div>
    <div class="flex gap-2">
      <input id="searchBox" oninput="render()" placeholder="🔍 Search a worry..." class="border rounded-full px-4 py-2 text-sm w-48 outline-none focus:ring-2 focus:ring-emerald-600">
      <button onclick="window.print()" class="bg-[#1e4e68] text-white text-sm font-bold px-4 py-2 rounded-xl">🖨️ Print / PDF 📖</button>
    </div>
  </div>
</div>
<main class="max-w-6xl mx-auto p-4 grid lg:grid-cols-[380px_1fr] gap-5 items-start">
  <div class="sticky-form no-print bg-white rounded-2xl shadow-lg p-5 border border-slate-200">
    <h2 class="text-lg font-extrabold text-emerald-900 mb-3">➕ Add a New Worry</h2>
    <label class="block text-sm font-bold mb-1">1 - Type of Worry</label>
    <select id="type1" onchange="onType1Change()" class="w-full border rounded-xl px-3 py-2.5 mb-2 outline-none focus:ring-2 focus:ring-emerald-600">
      <option value="Financial">💰 Financial</option><option value="Mental - Clutter">🧠 Mental - Clutter</option><option value="Professional - Teaching">🎓 Professional - Teaching</option><option value="Family">🏠 Family</option><option value="Health">🩺 Health</option><option value="Social">🤝 Social</option><option value="Spiritual - Religious">🕌 Spiritual - Religious</option><option value="__custom__">✍️ Other - Write it yourself</option>
    </select>
    <input id="customType1" placeholder="✍️ Write the new type here..." class="hidden mb-2 w-full border-2 border-amber-400 bg-amber-50 rounded-xl px-3 py-2.5 outline-none">
    <label class="block text-sm font-bold mb-1">2 - Specify the Worry</label>
    <select id="type2" onchange="onType2Change()" class="w-full border rounded-xl px-3 py-2.5 mb-2 outline
